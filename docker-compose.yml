services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: proyectounion
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
      dockerfile: src/ProyectoUnion.API/Dockerfile
    environment:
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=proyectounion;Username=postgres;Password=postgres"
      Minio__Endpoint: "http://minio:9000"
      MercadoPago__AccessToken: ""
      MercadoPago__WebhookSecret: ""
      AppBaseUrl: "http://localhost:5000"
      Email__Smtp__Host: ""
      Email__Smtp__Port: "587"
      Email__Smtp__User: ""
      Email__Smtp__Password: ""
      Email__Smtp__From: ""
      WhatsApp__AccessToken: ""
      WhatsApp__PhoneNumberId: ""
    ports:
      - "5000:5000"
    volumes:
      - dataprotection-keys:/app/dataprotection-keys
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      API_BASE_URL: "http://api:5000"
    ports:
      - "3001:3000"
    depends_on:
      - api

volumes:
  postgres-data:
  minio-data:
  dataprotection-keys:
